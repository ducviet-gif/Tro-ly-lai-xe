name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          DIR=$(dirname "$(find . -name settings.gradle -not -path '*/node_modules/*' | head -1)")
          echo "Thu muc du an: $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TroLyLaiXe.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TroLyLaiXe-APK
          path: TroLyLaiXe.apk
