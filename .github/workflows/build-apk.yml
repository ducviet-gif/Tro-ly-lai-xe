name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Sap xep lai thu muc du an
        run: |
          if [ ! -d app ]; then
            mkdir -p app/src/main/java/vn/trolylaixe/app app/src/main/assets/fonts app/src/main/res/values app/src/main/res/drawable
            mv build.gradle app/build.gradle
            mv "build (1).gradle" build.gradle
            mv MainActivity.java app/src/main/java/vn/trolylaixe/app/
            mv AndroidManifest.xml app/src/main/
            mv index.html app.js app/src/main/assets/
            mv *.woff2 app/src/main/assets/fonts/
            mv strings.xml styles.xml app/src/main/res/values/
            mv ic_launcher.xml app/src/main/res/drawable/
          fi
          find . -path ./.git -prune -o -type f -print

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk TroLyLaiXe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TroLyLaiXe-APK
          path: TroLyLaiXe.apk
